services:
  cv-generator-dev:
    build:
      context: .
      dockerfile: Containerfile
      target: development
    image: localhost/cv-generator:dev
    container_name: cv-generator-dev
    ports:
      - "${CV_GENERATOR_DEV_PORT:-5173}:5173"
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./:/app:z
      - node_modules:/app/node_modules

volumes:
  node_modules:
